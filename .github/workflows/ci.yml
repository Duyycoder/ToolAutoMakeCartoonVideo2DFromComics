name: CI (AIVoice — Studio)

on:
  push:
    branches: [master, "feat/**", "dev/**"]
  pull_request:
    branches: [master]

jobs:
  studio-tests:
    name: Studio GPU-free tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/MediaComposer
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai cong cu (khong torch)
        run: pip install ruff pytest numpy pillow loguru

      - name: Lint loi nghiem trong (studio)
        run: ruff check app/services/storytelling/studio tests/test_studio_*.py --select E9,F63,F7,F82

      - name: Bien dich package studio
        run: python -m compileall app/services/storytelling/studio -q

      - name: Chay test studio (GPU-free)
        run: >-
          python -m pytest
          tests/test_studio_matting.py
          tests/test_studio_compositor.py
          tests/test_studio_layout.py
          tests/test_studio_llm_layout.py
          tests/test_studio_shadow.py
          tests/test_studio_bg_cache.py
          tests/test_studio_pipeline_smoke.py -q
