name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'dev/**'
  pull_request:
    branches:
      - main
      - 'dev/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: orchestrator/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r orchestrator/requirements-dev.txt
      - name: Ruff Check
        run: python -m ruff check orchestrator tests
      - name: Compile Python
        run: python -m compileall orchestrator -q

  test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: orchestrator/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r orchestrator/requirements-dev.txt
      - name: Run Tests
        run: python -m pytest -q tests/
