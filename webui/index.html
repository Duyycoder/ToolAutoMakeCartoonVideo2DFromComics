<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Easy3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/dialogs.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/",
        "three-mesh-bvh": "./vendor/three-mesh-bvh/index.module.js",
        "three-bvh-csg": "./vendor/three-bvh-csg/index.module.js",
        "meshoptimizer/simplifier": "./vendor/meshoptimizer/meshopt_simplifier.js"
    } }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Easy<span>3D</span></div>
    <input id="project-name" class="project-name" value="Dự án của tôi" title="Tên dự án — bấm để đổi" spellcheck="false">
    <div class="topbar-group">
      <button data-action="new" title="Xoá hết, bắt đầu lại">🗋 Mới</button>
      <button data-action="open" title="Mở file GLB, GLTF, OBJ, STL, FBX, MESHY, BLEND (Ctrl+O)">📂 Mở file</button>
      <button data-action="save" title="Lưu dự án (Ctrl+S)">💾 Lưu</button>
      <div class="menu">
        <button data-action="toggle-export" class="accent-outline">⬇ Xuất file ▾</button>
        <div class="menu-list" id="export-menu" hidden>
          <button data-export="glb"><b>Cho game / Unity</b><small>GLB — giữ màu sắc, chất liệu</small></button>
          <button data-action="export-character"><b>🎮 Nhân vật cho game</b><small>Vật đang chọn → thư mục riêng game/&lt;Tên&gt;/</small></button>
          <button data-export="fbx"><b>FBX cho Unity</b><small>Cả cảnh → thư mục game/&lt;Tên dự án&gt;/ kèm ảnh, kéo vào Unity</small></button>
          <button data-action="export-character-fbx"><b>🎮 Nhân vật FBX cho Unity</b><small>Vật đang chọn, giữ xương + chuyển động, kèm ảnh, kéo vào Unity</small></button>
          <button data-export="stl"><b>Để in 3D</b><small>STL — đơn vị milimét</small></button>
          <button data-export="obj"><b>Định dạng OBJ</b><small>Mở được ở hầu hết phần mềm 3D</small></button>
          <button data-action="export-image"><b>📸 Xuất ảnh đẹp…</b><small>PNG — chọn HD/4K, nền trong suốt</small></button>
        </div>
      </div>
      <div class="menu">
        <button data-action="toggle-lighting">💡 Ánh sáng ▾</button>
        <div class="menu-list" id="lighting-menu" hidden>
          <button data-action="lighting-panel"><b>⚙ Chỉnh ánh sáng…</b><small>Hướng nắng, độ sáng, màu, bóng đổ</small></button>
          <button data-lighting="studio"><b>Studio</b><small>Sáng đều, nền tối — mặc định</small></button>
          <button data-lighting="outdoor"><b>Ngoài trời</b><small>Trời xanh, nắng trưa</small></button>
          <button data-lighting="sunset"><b>Hoàng hôn</b><small>Nắng cam chiếu xiên</small></button>
          <button data-lighting="night"><b>Ban đêm</b><small>Tối, hợp với đèn và vật phát sáng</small></button>
          <button data-lighting="stage"><b>Sân khấu</b><small>Nền đen, đèn rọi từ trên</small></button>
          <button data-light="point"><b>➕ Thêm đèn tròn</b><small>Toả sáng mọi hướng</small></button>
          <button data-light="spot"><b>➕ Thêm đèn rọi</b><small>Chiếu xuống, có bóng đổ</small></button>
          <button data-action="toggle-grid"><b>▦ Ẩn / hiện lưới sàn</b><small>Lưới chỉ để căn chỉnh</small></button>
        </div>
      </div>
    </div>
    <button data-action="toggle-timeline" title="Làm chuyển động: ghi tư thế theo thời gian, xuất video">🎬 Chuyển động</button>
    <div class="topbar-group">
      <button data-action="undo" id="btn-undo" title="Hoàn tác (Ctrl+Z)">↶ Hoàn tác</button>
      <button data-action="redo" id="btn-redo" title="Làm lại (Ctrl+Y)">↷ Làm lại</button>
    </div>
    <button data-action="help" class="help-btn" title="Hướng dẫn">? Hướng dẫn</button>
  </header>

  <aside class="toolbar">
    <button class="tool ai" data-action="image-to-3d" title="Tạo mô hình 3D từ 1 tấm ảnh bằng AI">
      <span class="ico">🪄</span>Tạo từ ảnh</button>
    <div class="tool-sep"></div>
    <button class="tool active" data-mode="translate" title="Kéo mũi tên để di chuyển (phím W)">
      <span class="ico">✥</span>Di chuyển<kbd>W</kbd></button>
    <button class="tool" data-mode="rotate" title="Kéo vòng tròn để xoay (phím E)">
      <span class="ico">⟳</span>Xoay<kbd>E</kbd></button>
    <button class="tool" data-mode="scale" title="Kéo khối vuông để phóng to/thu nhỏ (phím R)">
      <span class="ico">⤢</span>Co giãn<kbd>R</kbd></button>
    <button class="tool" data-action="edit-mode" title="Chọn từng điểm / mặt của vật để chỉnh chi tiết (phím Tab)">
      <span class="ico">✏</span>Chỉnh điểm<kbd>Tab</kbd></button>
    <button class="tool" data-action="paint-mode" title="Tô màu, vẽ, dán ảnh trực tiếp lên vật (phím B)">
      <span class="ico">🖌</span>Tô vẽ<kbd>B</kbd></button>
    <button class="tool" data-action="sculpt-mode" title="Nặn hình bằng cọ: đắp, lõm, kéo, làm mượt, làm phẳng (phím N)">
      <span class="ico">🗿</span>Nặn hình<kbd>N</kbd></button>
    <button class="tool" data-action="rig-mode" title="Gắn xương rồi tạo dáng nhân vật (phím J)">
      <span class="ico">🦴</span>Ghép xương<kbd>J</kbd></button>
    <div class="tool-sep"></div>
    <div class="menu side">
      <button class="tool" data-action="toggle-shapes" title="Thêm khối có sẵn">
        <span class="ico">➕</span>Thêm khối</button>
      <div class="menu-list shapes" id="shape-menu" hidden>
        <button data-shape="box">⬛ Hộp</button>
        <button data-shape="sphere">⚪ Cầu</button>
        <button data-shape="cylinder">🛢 Trụ</button>
        <button data-shape="cone">🔺 Nón</button>
        <button data-shape="torus">🍩 Vòng xuyến</button>
        <button data-shape="plane">▭ Tấm phẳng</button>
      </div>
    </div>
    <button class="tool" data-action="frame-all" title="Đưa camera nhìn toàn bộ (phím F)">
      <span class="ico">⌖</span>Nhìn tất cả<kbd>F</kbd></button>
  </aside>

  <main id="viewport">
    <div class="viewport-hint">🖱 Chuột trái: xoay · Chuột phải: kéo · Lăn: phóng to · 1 ô lưới = 50 cm</div>
    <div class="empty-hint" id="empty-hint">
      <div class="empty-icon">📦</div>
      <p>Cảnh đang trống</p>
      <small>Kéo thả ảnh hoặc file 3D vào đây, hoặc bấm <b>Tạo từ ảnh</b> / <b>Thêm khối</b></small>
    </div>
    <div class="drop-overlay" id="drop-overlay" hidden>Thả vào đây để mở</div>
  </main>

  <aside class="sidepanel">
    <section>
      <h3>Vật thể trong cảnh</h3>
      <ul id="outliner" class="outliner"></ul>
    </section>
    <section id="props"></section>
  </aside>

  <footer class="statusbar">
    <span id="status-gpu">Đang kiểm tra GPU...</span>
    <span id="status-stats"></span>
    <span id="status-tip" class="tip"></span>
  </footer>

  <div id="toasts" class="toasts"></div>
  <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl,.fbx,.meshy,.blend" hidden>
  <script type="module" src="js/app-main.js"></script>
</body>
</html>
